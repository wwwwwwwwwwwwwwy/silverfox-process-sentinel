<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>银狐进程监视器 · SilverFox Sentinel</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
        <path d="M16 2 4 7v9c0 7.2 5.1 12.6 12 14 6.9-1.4 12-6.8 12-14V7L16 2z"
              fill="none" stroke="#3b82f6" stroke-width="1.6"/>
        <path d="M16 9.5 9.5 12v5c0 3.6 2.8 6.6 6.5 7.4 3.7-.8 6.5-3.8 6.5-7.4v-5L16 9.5z"
              fill="none" stroke="#60a5fa" stroke-width="1.1" opacity=".75"/>
        <circle cx="16" cy="16" r="2.2" fill="#ff5c5c"/>
      </svg>
    </div>
    <div class="brand-text">
      <h1>银狐进程监视器</h1>
      <span class="sub">SILVERFOX&nbsp;PROCESS&nbsp;SENTINEL<span id="brandVer"></span></span>
    </div>
  </div>

  <div class="topbar-right">
    <div class="pill" id="pillStatus"><i class="dot"></i><span data-t="pill_init">初始化</span></div>
    <div class="pill" id="pillAdmin"><i class="dot"></i><span>权限检测中</span></div>
    <div class="pill" id="pillUptime"><span>运行 00:00</span></div>
    <div class="seg langseg" id="langSeg" title="切换专业用语版 / 大白话版">
      <button data-lang="pro">专业用语</button>
      <button data-lang="plain" class="on">大白话</button>
    </div>
    <button class="btn" id="btnScan" data-t="btn_scan">立即重扫</button>
    <button class="btn primary" id="btnExport" data-t="btn_export">导出报告</button>
  </div>
</header>

<main>
  <section class="kpis" id="kpis"></section>

  <nav class="tabs">
    <button class="tab active" data-tab="proc"><span data-t="tab_proc">进程监控</span> <em id="tabProcCount"></em></button>
    <button class="tab" data-tab="net"><span data-t="tab_net">网络监控</span> <em id="tabNetCount"></em></button>
    <button class="tab" data-tab="art"><span data-t="tab_art">系统痕迹</span> <em id="tabArtCount"></em></button>
    <button class="tab" data-tab="alert"><span data-t="tab_alert">告警时间线</span> <em id="tabAlertCount"></em></button>
    <button class="tab" data-tab="rules"><span data-t="tab_rules">规则与 IOC</span></button>
  </nav>

  <!-- ===================== 进程监控 ===================== -->
  <section class="panel tabpane active" id="pane-proc">
    <div class="toolbar">
      <input type="search" id="q" data-tph="ph_proc"
             placeholder="搜索进程名 / 路径 / PID / 命令行…" autocomplete="off">
      <div class="seg" id="segLevel">
        <button data-lv="all" class="on" data-t="seg_all">全部</button>
        <button data-lv="risky" data-t="seg_risky">仅异常</button>
        <button data-lv="critical" data-t="lv_critical">严重</button>
        <button data-lv="high" data-t="lv_high">高危</button>
      </div>
      <label class="chk"><input type="checkbox" id="chkConn"> <span data-t="chk_conn">仅看有外联</span></label>
      <span class="toolbar-info" id="procInfo"></span>
    </div>

    <div class="tablewrap">
      <table class="grid" id="procTable">
        <thead>
          <tr>
            <th class="c-risk" data-sort="score" data-t="th_risk">风险</th>
            <th class="c-name" data-sort="name" data-t="th_proc">进程</th>
            <th class="c-pid" data-sort="pid">PID</th>
            <th class="c-path" data-sort="exe" data-t="th_path">路径</th>
            <th class="c-sig" data-sort="sig" data-t="th_sig">数字签名</th>
            <th class="c-net" data-sort="conn" data-t="th_net">外联</th>
            <th class="c-hit" data-t="th_hit">命中规则</th>
          </tr>
        </thead>
        <tbody id="procBody"></tbody>
      </table>
    </div>
  </section>

  <!-- ===================== 网络监控 ===================== -->
  <section class="panel tabpane" id="pane-net">
    <div class="netctl">
      <div class="netctl-main">
        <div class="netctl-head">
          <span class="netctl-label" data-t="net_dur">观测时长</span>
          <span class="netctl-val" id="netDurVal">—</span>
          <span class="netctl-hint" id="netDurHint"></span>
        </div>
        <div class="slider-wrap">
          <input type="range" id="netSlider" min="0" max="7" step="1" value="2"
                 aria-label="观测时长" autocomplete="off">
          <div class="slider-ticks" id="netTicks"></div>
        </div>
      </div>
      <div class="netctl-acts">
        <button class="btn primary" id="netStart" data-t="net_restart">重新检测</button>
        <button class="btn" id="netStop" data-t="net_stop">停止</button>
      </div>
    </div>

    <div class="netprog">
      <div class="netbar"><i id="netBar"></i></div>
      <div class="netprog-meta" id="netProgMeta"></div>
    </div>

    <div class="toolbar">
      <div class="seg" id="segNet">
        <button data-nf="focus" class="on" data-t="net_focus">重点关注</button>
        <button data-nf="regular" data-t="net_regular">仅高规律</button>
        <button data-nf="risky" data-t="net_risky">仅可疑</button>
        <button data-nf="all" data-t="seg_all">全部</button>
      </div>
      <input type="search" id="netQ" data-tph="ph_net"
             placeholder="搜索进程 / 远端 IP / 端口…" autocomplete="off">
      <label class="chk"><input type="checkbox" id="chkNetBytes"> <span data-t="chk_bytes">仅看有数据传输</span></label>
      <span class="toolbar-info" id="netInfo"></span>
    </div>

    <div class="tablewrap">
      <table class="grid netgrid" id="netTable">
        <thead>
          <tr>
            <th class="c-risk" data-nsort="score" data-t="th_risk">风险</th>
            <th class="c-reg" data-nsort="regularity" data-t="th_reg">规律性</th>
            <th class="c-name" data-nsort="name" data-t="th_proc">进程</th>
            <th class="c-remote" data-nsort="rip" data-t="th_remote">远端地址</th>
            <th class="c-bytes" data-nsort="bytes" data-t="th_bytes">流量 / 事件</th>
            <th class="c-verdict" data-t="th_verdict">判定依据</th>
          </tr>
        </thead>
        <tbody id="netBody"></tbody>
      </table>
    </div>

    <div class="art-empty" id="netEmpty">
      <b data-t="net_empty">本时段未发现规律性异常的网络外联</b>
      <p id="netEmptyWhy"></p>
    </div>

    <div class="netnotes" id="netNotes"></div>
  </section>

  <!-- ===================== 系统痕迹 ===================== -->
  <section class="panel tabpane" id="pane-art">
    <div class="arthint" id="artHint"></div>
    <div class="toolbar">
      <div class="seg" id="segArtKind">
        <button data-kind="all" class="on" data-t="seg_all">全部</button>
        <button data-kind="task" data-t="art_kind_task">计划任务</button>
        <button data-kind="service" data-t="art_kind_service">服务</button>
        <button data-kind="driver" data-t="art_kind_driver">驱动</button>
        <button data-kind="hosts" data-t="art_kind_hosts">hosts</button>
        <button data-kind="registry" data-t="art_kind_registry">注册表</button>
        <button data-kind="file" data-t="art_kind_file">文件</button>
      </div>
      <span class="toolbar-info" id="artInfo"></span>
    </div>
    <div class="artlist" id="artList"></div>
    <div class="art-empty" id="artEmpty">
      <b data-t="art_empty_title">未发现异常系统痕迹</b>
      <p data-t="art_empty_body"></p>
    </div>
  </section>

  <!-- ===================== 告警 ===================== -->
  <section class="panel tabpane" id="pane-alert">
    <div class="timeline" id="alertList"></div>
    <div class="art-empty" id="alertEmpty">
      <b data-t="alert_empty_title">暂无告警</b>
      <p data-t="alert_empty_body"></p>
    </div>
  </section>

  <!-- ===================== 规则与 IOC ===================== -->
  <section class="panel tabpane" id="pane-rules">
    <div class="arthint" id="rulesHint"></div>
    <h2 class="sec"><span data-t="sec_status">安全状态</span> <span id="secChecked"></span></h2>
    <div class="secgrid" id="secBox"></div>

    <!-- 受监控的文件 / 目录（2026-10-07 新增）：把"文件被改动就告警"从
         「只管本程序」扩展到「用户指定的任意路径」。 -->
    <h2 class="sec" style="margin-top:22px">
      <span data-t="watch_h">受监控的文件 / 目录</span> <span id="watchCount"></span>
    </h2>
    <div class="watchbox" id="watchBox"></div>

    <div class="two-col" style="margin-top:20px">
      <div>
        <h2 class="sec"><span data-t="sec_rules">检测规则库</span> <span id="ruleCount"></span></h2>
        <div class="rulegrid" id="ruleList"></div>
      </div>
      <div>
        <h2 class="sec"><span data-t="sec_ioc">IOC 指标库</span> <span id="iocVer"></span></h2>
        <div class="iocbox" id="iocBox"></div>
      </div>
    </div>
  </section>
</main>

<!-- ===================== 进程详情抽屉 ===================== -->
<div class="drawer-mask" id="mask"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <div>
      <h2 id="dName">—</h2>
      <div class="drawer-sub" id="dSub">—</div>
    </div>
    <button class="iconbtn" id="dClose">✕</button>
  </div>
  <div class="drawer-body" id="dBody"></div>
</aside>

<!-- ===================== 确认弹窗 ===================== -->
<div class="modal-mask" id="modalMask">
  <div class="modal" id="modal">
    <h3 id="mTitle">确认操作</h3>
    <div id="mBody"></div>
    <div class="modal-foot">
      <button class="btn" id="mCancel">取消</button>
      <button class="btn danger" id="mOk">确认</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toasts"></div>

<script src="/static/app.js"></script>
</body>
</html>
